<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Protocol fuzzer console</title>
<style>
:root {
  color-scheme: light dark;
  --bench: #E7ECEE; --panel: #F6F8F9; --field: #FFFFFF;
  --ink: #17262E; --ink2: #4A5C66; --rule: #C3CDD2;
  --accent: #0B6477; --accent-ink: #FFFFFF;
  --f0: #D9E7EE; --f1: #E6E1EF;
  --mut: #A3195B; --mut-bg: #F7C6DC; --mut-ink: #5E0C33;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --r: 4px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bench: #12191D; --panel: #1A242A; --field: #0F171B;
    --ink: #E4ECEF; --ink2: #A3B4BC; --rule: #34444D;
    --accent: #5CC0D6; --accent-ink: #0B1A20;
    --f0: #243743; --f1: #2F2B3F;
    --mut: #FF7DB0; --mut-bg: #5E1A3C; --mut-ink: #FFD3E5;
  }
}
.st-DRY_RUN { --s: #7B8E99; } .st-OK { --s: #2F8F5B; } .st-TIMEOUT { --s: #7A5BC0; }
.st-CONNECTION_RESET { --s: #D9822B; } .st-PROTOCOL_ERROR { --s: #C9A100; } .st-CRASH_SUSPECT { --s: #C62F2F; }
.st-STATE_CONFUSION { --s: #2F6FD0; } .st-SECURITY_POLICY_BYPASS { --s: #B3255E; }
.st-RESOURCE_LEAK { --s: #8A8A1E; } .st-TRANSPORT_ERROR { --s: #5E6B73; }

* { box-sizing: border-box; }
html { scroll-padding-top: 12px; }
body { margin: 0; background: var(--bench); color: var(--ink); font: 14px/1.5 var(--sans); }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
.muted { color: var(--ink2); }
.num { font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.top .grow { flex: 1; }
.mode { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.mode::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #2F8F5B; }

.btn { color: inherit; border: 1px solid var(--rule); background: var(--field); border-radius: var(--r); padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--ink2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.small { padding: 2px 8px; font-size: 12px; }

.shell { display: grid; grid-template-columns: 288px minmax(0, 1fr); align-items: start; }
body.static .shell { grid-template-columns: minmax(0, 1fr); }
body.static .rail { display: none; }
.rail { align-self: stretch; background: var(--panel); border-right: 1px solid var(--rule); padding: 16px 18px 24px; min-height: calc(100vh - 53px); display: grid; gap: 22px; align-content: start; }
.rail section { display: grid; gap: 10px; }
.rail .hint { font-size: 13px; color: var(--ink2); }
.grp { display: grid; gap: 4px; margin-top: 4px; }
.grp-h { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.proto { display: grid; grid-template-columns: 20px 1fr; gap: 0 6px; padding-left: 4px; }
.proto input { margin: 4px 0 0; }
.proto small { grid-column: 2; color: var(--ink2); font-size: 12.5px; line-height: 1.35; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fields label { display: grid; gap: 4px; font-size: 13px; }
.fields input { width: 100%; padding: 6px 8px; background: var(--field); border: 1px solid var(--rule); border-radius: var(--r); }
.fields .wide { grid-column: 1 / -1; }
.runs { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.runs button { width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 6px 8px; cursor: pointer; border-radius: 0 var(--r) var(--r) 0; display: grid; }
.runs button:hover { background: var(--bench); }
.runs button[aria-current="true"] { border-left-color: var(--accent); background: var(--bench); }
.runs small { color: var(--ink2); }
.err { color: #B42318; font-size: 13px; }
@media (prefers-color-scheme: dark) { .err { color: #FF9C93; } }

main { padding: 18px 20px 40px; display: grid; gap: 18px; min-width: 0; }
.empty { padding: 48px 8px; max-width: 52ch; display: grid; gap: 8px; }
.empty h2 { font-size: 18px; }

.runhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
.runhead h2 { font-size: 20px; letter-spacing: -0.01em; }
.runhead .spacer { flex: 1; }
.runhead .acts { display: flex; gap: 8px; }

.pane { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); }
.summary { padding: 14px 16px; display: grid; gap: 14px; }
.bar { display: flex; height: 10px; border-radius: 2px; overflow: hidden; background: var(--rule); }
.bar > i { background: var(--s); min-width: 3px; }
.bar.sm { height: 6px; width: 120px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; list-style: none; margin: 0; padding: 0; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 2px; background: var(--s); display: inline-block; flex: none; }
.cover { display: grid; gap: 0; }
.cover-row { display: grid; grid-template-columns: 200px 130px minmax(0, 1fr); gap: 4px 16px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); }
.cover-row .pname { font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.tag { display: inline-flex; gap: 6px; align-items: baseline; padding: 0 7px; border: 1px solid var(--rule); border-left: 3px solid var(--mut); border-radius: 2px; background: var(--field); font-size: 12.5px; }
.tag.seq { border-left-color: var(--accent); }
.tag.base { border-left-color: var(--rule); color: var(--ink2); }
.note { font-size: 13px; color: var(--ink2); max-width: 78ch; }

.work { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
.filters input, .filters select { padding: 5px 8px; background: var(--field); border: 1px solid var(--rule); border-radius: var(--r); }
.filters input[type=search] { flex: 1; min-width: 140px; }
.count { margin-left: auto; font-size: 13px; color: var(--ink2); }
.tbl-wrap { max-height: 64vh; overflow: auto; }
table { border-collapse: collapse; width: 100%; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 600; font-size: 13px; padding: 7px 10px; border-bottom: 1px solid var(--rule); z-index: 1; }
td { padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
tbody tr[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 15%, transparent); }
tbody tr[aria-selected="true"] td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
td.name { overflow-wrap: break-word; word-break: break-word; }
td.name .sub { color: var(--ink2); font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--s); flex: none; }
.more { padding: 10px 12px; }

.detail { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding: 16px; display: grid; gap: 16px; }
.detail .dhead { display: grid; gap: 6px; }
.detail .dhead h3 { overflow-wrap: anywhere; font-size: 15px; }
.meta-line { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink2); }
.step { display: grid; gap: 8px; }
.step-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.step-h .sp { flex: 1; }
.insp { display: grid; gap: 8px; }
.dump { overflow-x: auto; padding-bottom: 4px; }
.hx { font-family: var(--mono); font-size: 13px; line-height: 1.85; }
.hx-row { display: flex; gap: 16px; white-space: nowrap; }
.off { color: var(--ink2); width: 4.5ch; flex: none; }
.hx-bytes { width: calc(16 * 2.55ch + 1.5ch); flex: none; }
.b { display: inline-block; width: 2.55ch; text-align: center; }
.b.g { margin-left: 1.5ch; }
.a { display: inline-block; width: 1ch; text-align: center; }
.f0 { background: var(--f0); } .f1 { background: var(--f1); }
.b.s { box-shadow: inset 2px 0 0 color-mix(in srgb, var(--ink) 40%, transparent); }
.b.m, .a.m { background: var(--mut-bg); color: var(--mut-ink); font-weight: 700; box-shadow: inset 0 -3px 0 var(--mut); }
.b.hl, .a.hl { outline: 2px solid var(--accent); outline-offset: -2px; position: relative; z-index: 1; }
.focusline { min-height: 1.5em; font-size: 13px; color: var(--ink2); font-family: var(--mono); overflow-wrap: anywhere; }
.flds { list-style: none; margin: 0; padding: 0; display: grid; font-size: 13px; }
.fld { display: grid; grid-template-columns: 14px 9.5em 10em minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 3px 4px; border-radius: var(--r); }
.fld:hover, .fld.hl { background: var(--bench); }
.fld .sw { width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--rule); }
.fld .sw.m { background: var(--mut-bg); border-color: var(--mut); }
.fld .fname { font-weight: 600; overflow-wrap: anywhere; }
.fld .frange, .fld .fval { color: var(--ink2); font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.fld .mtag { color: var(--mut); font-weight: 600; font-size: 12.5px; }
.cmd { display: flex; gap: 8px; align-items: flex-start; }
.cmd code { flex: 1; font-family: var(--mono); font-size: 12.5px; background: var(--field); border: 1px solid var(--rule); border-radius: var(--r); padding: 6px 8px; overflow-wrap: anywhere; }
details summary { cursor: pointer; font-weight: 600; }
details pre { margin: 8px 0 0; padding: 10px; background: var(--field); border: 1px solid var(--rule); border-radius: var(--r); overflow: auto; font: 12px/1.5 var(--mono); max-height: 280px; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--ink2); } dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 1180px) {
  .work { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; max-height: none; }
  .tbl-wrap { max-height: 50vh; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { min-height: 0; border-right: 0; border-bottom: 1px solid var(--rule); }
  .cover-row { grid-template-columns: minmax(0, 1fr); }
  .fld { grid-template-columns: 14px minmax(0, 1fr) auto; }
  .fld .frange, .fld .fval { grid-column: 2 / -1; }
  th.hide-s, td.hide-s { display: none; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>

}

async function copyText(text, btn) {
  const done = () => { const old = btn.textContent; btn.textContent = 'Copied'; announce('Copied'); setTimeout(() => { btn.textContent = old; }, 1400); };
  try { await navigator.clipboard.writeText(text); done(); return; } catch (_) { /* fall through */ }
  const ta = h('textarea', { 'aria-hidden': 'true' }); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.append(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (_) { btn.textContent = 'Copy failed'; }
  ta.remove();
}

function renderDetail(r) {
  const box = $('#detail'); box.textContent = '';
  if (!r) { box.append(h('p', { class: 'muted', text: 'Select a case to inspect its bytes.' })); return; }
  const m = meta(r), f = mutatedFields(r), n = (r.payload_hex || []).length || (m.layouts || []).length;
  const what = f.length ? `Changed: ${f.join(', ')}.` : m.sequence_mutation ? `Message order: ${m.sequence_mutation}.` : 'Unmodified seed message.';
  box.append(h('div', { class: 'dhead' },
    h('h3', { text: r.case_name }),
    h('div', { class: 'meta-line' }, chip(r.status), h('span', { text: label(PROTO_LABEL, r.protocol) }), h('span', { text: label(LAYER_LABEL, r.layer) })),
    h('p', { text: what }),
    (r.reasons || []).length ? h('p', { class: 'muted', text: r.reasons.join('; ').replace(/^./, (c) => c.toUpperCase()) + '.' }) : null));

  (r.payload_hex || []).forEach((hex, i) => {
    const layout = (m.layouts || [])[i] || [], labels = m.labels || [];
    box.append(h('div', { class: 'step' },
      h('div', { class: 'step-h' },
        h('h3', { text: n > 1 ? `Step ${i + 1} of ${n}${labels[i] ? ': ' + labels[i] : ''}` : (labels[i] || 'Payload') }),
        h('span', { class: 'muted num', text: `${hex.length >> 1} bytes` }), h('span', { class: 'sp' }),
        h('button', { class: 'btn small', onclick: (e) => copyText(hex, e.currentTarget), text: 'Copy hex' })),
      inspector(hex, layout, (m.mutated || [])[i])));
  });
  if (!(r.payload_hex || []).length) box.append(h('p', { class: 'muted', text: 'Payload bytes were not saved in this report (report.save_payload_hex is off).' }));

  const ex = (r.observations && r.observations.expected) || {};
  if (ex.allowed || ex.not_allowed) {
    box.append(h('dl', { class: 'kv' },
      ex.allowed ? [h('dt', { text: 'Acceptable' }), h('dd', { text: ex.allowed.join(', ') })] : null,
      ex.not_allowed ? [h('dt', { text: 'Not acceptable' }), h('dd', { text: ex.not_allowed.join(', ') })] : null));
  }
  if (r.replay) box.append(h('div', { class: 'step' }, h('h3', { text: 'Replay this case' }),
    h('div', { class: 'cmd' }, h('code', { text: r.replay }), h('button', { class: 'btn small', onclick: (e) => copyText(r.replay, e.currentTarget), text: 'Copy' }))));
  const obs = h('pre'); obs.textContent = JSON.stringify({ seed: r.seed, started_at: r.started_at, duration_ms: r.duration_ms, error: r.error,
    transport: r.observations && r.observations.transport, monitor_before: r.observations && r.observations.monitor_before,
    monitor_after: r.observations && r.observations.monitor_after }, null, 2);
  box.append(h('details', {}, h('summary', { text: 'Raw observations' }), obs));
}

/* ---------- page assembly ---------- */
const fmtTime = (iso) => { try { return new Date(iso).toLocaleString(); } catch (_) { return iso || ''; } };
function downloadJson() {
  const blob = new Blob([JSON.stringify(state.report, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `fuzz-report-${(state.report.meta || {}).name || 'run'}.json` });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function showReport(report, runId) {
  report.results.forEach((r, i) => { r.index = i; });
  state.report = report; state.runId = runId || null; state.selected = null; state.shown = PAGE;
  state.filters = { q: '', layer: '', status: '' };
  const m = report.meta || {}, main = $('#main'); main.textContent = '';
  document.title = `${m.name || 'Report'} - Protocol fuzzer console`;
  const acts = h('div', { class: 'acts' },
    runId && !EMBEDDED ? h('a', { class: 'btn', href: `/api/runs/${runId}/export`, text: 'Download HTML report' }) : null,
    h('button', { class: 'btn', onclick: downloadJson, text: 'Download JSON' }));
  main.append(h('div', { class: 'runhead' },
    h('h2', { text: m.name || 'Fuzz run' }),
    h('span', { class: 'muted num', text: `${report.results.length} cases` }),
    m.seed != null ? h('span', { class: 'muted num', text: `seed ${m.seed}` }) : null,
    m.generated_at ? h('span', { class: 'muted', text: fmtTime(m.generated_at) }) : null,
    h('span', { class: 'spacer' }), acts));
  if (!report.results.length) { main.append(h('p', { class: 'muted', text: 'This run produced no cases.' })); return; }
  main.append(renderSummary(report));
  const detail = h('section', { class: 'pane detail', id: 'detail', 'aria-label': 'Case detail' });
  main.append(h('div', { class: 'work' }, renderList(report), detail));
  fillRows(); renderDetail(null);
  const first = report.results.find((r) => mutatedFields(r).length) || report.results[0];
  select(first.index, false);
  renderRuns();
}

/* ---------- live server mode ---------- */
async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
  return body;
}
function renderRail() {
  const rail = $('#rail'), m = state.meta; rail.textContent = '';
  const err = h('p', { class: 'err', id: 'runerr', role: 'alert' });
  const groups = m.layers.map((layer) => {
    const protos = m.protocols.filter((p) => p.layer === layer.id); if (!protos.length) return null;
    const layerBox = h('input', { type: 'checkbox', 'data-layer': layer.id, 'aria-label': `All ${layer.label} protocols`,
      onchange: (e) => { rail.querySelectorAll(`input[data-pl="${layer.id}"]`).forEach((c) => { c.checked = e.target.checked; }); } });
    const sync = () => {
      const boxes = [...rail.querySelectorAll(`input[data-pl="${layer.id}"]`)], on = boxes.filter((b) => b.checked).length;
      layerBox.checked = on === boxes.length; layerBox.indeterminate = on > 0 && on < boxes.length;
    };
    return h('div', { class: 'grp' }, h('label', { class: 'grp-h' }, layerBox, layer.label),
      protos.map((p) => h('label', { class: 'proto' },
        h('input', { type: 'checkbox', value: p.id, 'data-pl': layer.id, checked: m.defaults.protocols.includes(p.id), onchange: sync }),
        h('span', { text: p.label }), h('small', { text: p.description }))));
  });
  const cases = h('input', { type: 'number', id: 'cases', min: 1, max: m.max_cases, value: m.defaults.cases });
  const seed = h('input', { type: 'number', id: 'seed', min: 0, max: 2147483647, value: m.defaults.seed });
  const run = h('button', { class: 'btn primary', id: 'runbtn', onclick: runCampaign, text: 'Run dry campaign' });
  rail.append(
    h('section', {}, h('h2', { text: 'New run' }),
      h('div', {}, groups),
      h('div', { class: 'fields' },
        h('label', {}, 'Cases per protocol', cases), h('label', {}, 'Seed', seed),
        h('p', { class: 'hint wide', text: 'The same seed always produces the same bytes.' })),
      run, err,
      h('p', { class: 'hint', text: 'Cases are generated and classified. Nothing is sent to any target.' })),
    h('section', {}, h('h2', { text: 'Recent runs' }), h('ul', { class: 'runs', id: 'runs' })));
  rail.querySelectorAll('input[data-layer]').forEach((box) => {
    const boxes = [...rail.querySelectorAll(`input[data-pl="${box.dataset.layer}"]`)], on = boxes.filter((b) => b.checked).length;
    box.checked = on === boxes.length; box.indeterminate = on > 0 && on < boxes.length;
  });
  renderRuns();
}
function renderRuns() {
  const ul = $('#runs'); if (!ul) return; ul.textContent = '';
  if (!state.runs.length) { ul.append(h('li', { class: 'hint', text: 'Runs appear here while the server is running.' })); return; }
  state.runs.forEach((r) => ul.append(h('li', {}, h('button', { 'aria-current': String(r.id === state.runId), onclick: () => openRun(r.id) },
    h('span', { text: r.name }), h('small', { class: 'num', text: `${r.total} cases, seed ${r.seed}, ${fmtTime(r.generated_at)}` })))));
}
async function openRun(id) {
  try { showReport(await api(`/api/runs/${id}`), id); } catch (e) { $('#runerr').textContent = e.message; }
}
async function runCampaign() {
  const err = $('#runerr'), btn = $('#runbtn'); err.textContent = '';
  const protocols = [...document.querySelectorAll('input[data-pl]:checked')].map((c) => c.value);
  if (!protocols.length) { err.textContent = 'Choose at least one protocol.'; return; }
  const cases = parseInt($('#cases').value, 10), seed = parseInt($('#seed').value, 10);
  if (!(cases >= 1 && cases <= state.meta.max_cases)) { err.textContent = `Cases must be between 1 and ${state.meta.max_cases}.`; return; }
  if (!(seed >= 0)) { err.textContent = 'Seed must be zero or greater.'; return; }
  btn.disabled = true; btn.textContent = 'Running...'; announce('Running campaign');
  try {
    const report = await api('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ protocols, cases, seed }) });
    state.runs = (await api('/api/runs')).runs;
    showReport(report, report.id); announce(`Run finished with ${report.results.length} cases`);
  } catch (e) { err.textContent = e.message; announce('Run failed'); }
  btn.disabled = false; btn.textContent = 'Run dry campaign';
}
function renderEmpty() {
  const main = $('#main'); main.textContent = '';
  main.append(h('div', { class: 'empty' }, h('h2', { text: 'No results yet' }),
    h('p', { class: 'muted', text: 'Choose protocols on the left and run a dry campaign. Every generated case opens as a byte-level view showing which fields the mutation changed.' })));
}

async function init() {
  if (EMBEDDED) {
    document.body.classList.add('static');
    $('#topnote').textContent = 'Saved report';
    showReport(EMBEDDED, null);
    return;
  }
  try {
    state.meta = await api('/api/meta');
    state.runs = (await api('/api/runs')).runs;
    renderRail();
    if (state.runs.length) await openRun(state.runs[0].id); else renderEmpty();
  } catch (e) {
    $('#main').append(h('p', { class: 'err', role: 'alert', text: `Cannot reach the console server: ${e.message}` }));
  }
}
init();
})();
</script>
</body>
</html>
